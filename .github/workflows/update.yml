name: Actualizar matches.json (5 min)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      competition:
        description: 'Competición a mostrar'
        required: false
        default: 'mundial'
        type: choice
        options:
          - mundial
          - champions
          - laliga

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMPETITION: ${{ github.event.inputs.competition || 'mundial' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch datos de ${{ github.event.inputs.competition || 'mundial' }}
        run: node scripts/fetch.mjs

      - name: Commit matches.json si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --cached --quiet || git commit -m "chore: actualizar matches.json [${{ env.COMPETITION }}] [skip ci]"
          git push
